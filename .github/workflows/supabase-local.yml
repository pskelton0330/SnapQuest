name: Supabase local stack

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-local-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start isolated local Supabase stack and apply migrations
        run: supabase start -x studio,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Verify Realtime publication covers live app subscriptions
        shell: bash
        run: |
          actual=$(docker exec supabase_db_snapquest-local-tests psql -U postgres -Atc "select string_agg(tablename, ',' order by tablename) from pg_publication_tables where pubname = 'supabase_realtime' and schemaname = 'public' and tablename in ('hunt_messages','hunts','hunt_votes','participants','submissions','team_selfies','teams')")
          expected='hunt_messages,hunt_votes,hunts,participants,submissions,team_selfies,teams'
          echo "Published app tables: ${actual:-<none>}"
          test "$actual" = "$expected"

      - name: Verify public table RLS and anonymous security-definer grants
        shell: bash
        run: |
          unprotected_tables=$(docker exec supabase_db_snapquest-local-tests psql -U postgres -Atc "select coalesce(string_agg(format('%I.%I', n.nspname, c.relname), ', ' order by c.relname), '') from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'public' and c.relkind in ('r','p') and not c.relrowsecurity")
          echo "Public tables without RLS: ${unprotected_tables:-<none>}"
          test -z "$unprotected_tables"

          anonymous_definer_functions=$(docker exec supabase_db_snapquest-local-tests psql -U postgres -Atc "select coalesce(string_agg(p.oid::regprocedure::text, ', ' order by p.oid::regprocedure::text), '') from pg_proc p join pg_namespace n on n.oid = p.pronamespace where n.nspname = 'public' and p.prosecdef and has_function_privilege('anon', p.oid, 'EXECUTE') and p.oid not in ('public.list_hunt_templates(boolean)'::regprocedure, 'public.preview_invitation(text)'::regprocedure)")
          echo "Unapproved anon security-definer RPC grants: ${anonymous_definer_functions:-<none>}"
          test -z "$anonymous_definer_functions"

      - name: Export local Supabase connection settings
        run: supabase status --output env | sed -E 's/^([^=]+)="(.*)"$/\1=\2/' >> "$GITHUB_ENV"

      - name: Verify app schema and storage bucket
        run: node scripts/verify-supabase-local.mjs

      - name: Capture Realtime service errors after a failed integration check
        if: failure()
        shell: bash
        run: |
          docker logs --tail 300 supabase_realtime_snapquest-local-tests 2>&1 | grep -iE 'error|postgres_changes|publication|replication|permission|policy' | tail -n 80 || true

      - name: Stop isolated local stack
        if: always()
        run: supabase stop --no-backup
